<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>资料问答工作台</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#14171c; --muted:#69707d;
    --line:#e5e7eb; --line-strong:#cdd2da;
    --accent:#2563eb; --accent-ink:#1d4ed8; --accent-soft:#eff4ff;
    --ok:#15803d; --ok-soft:#e9f7ee;
    --warn:#b45309; --warn-soft:#fdf4e4;
    --bad:#b91c1c; --bad-soft:#fdecea;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --radius:12px; --radius-sm:9px;
    --tap:40px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  /* 网格里的长中文、长 token（u001:p19、43,662）都可能把轨道顶宽，导致整页横向溢出。
     这里用 clip 兜底（hidden 会变成滚动容器，clip 不会）。 */
  html{overflow-x:clip}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:clip;
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* ---------------- header ---------------- */
  header{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
  header h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:.1px;white-space:nowrap}
  header .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1;min-width:0}
  .status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-family:var(--mono);flex:0 0 auto;min-width:0}
  .status #health{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .dot.off{background:var(--bad)}

  /* ---------------- layout ---------------- */
  main{
    display:grid;grid-template-columns:344px minmax(0,1fr);gap:16px;
    padding:16px 24px 72px;max-width:1460px;margin:0 auto;align-items:start;
  }
  aside{min-width:0}
  @media (max-width:1080px){ main{grid-template-columns:minmax(0,1fr)} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-hd{
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
    min-height:48px;
  }
  .card-hd h2{font-size:13.5px;margin:0;font-weight:650;letter-spacing:.1px}
  .card-hd .count{color:var(--muted);font-size:12px;font-family:var(--mono);margin-left:auto}
  /* 模型选择器：放在提问卡头部而不是输入框旁边。
     理由是它改的是"用谁回答"，不是"怎么检索"——和范围/条数不是一类东西，
     挤进 askbar 会把那一行撑成两行。 */
  .model-pick{
    font:inherit;font-size:11.5px;font-family:var(--mono);line-height:1.2;
    padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;
    color:var(--ink);max-width:186px;min-width:0;flex:0 0 auto;cursor:pointer;
    transition:.15s;
  }
  .model-pick:hover{border-color:var(--line-strong)}
  .model-pick:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* 清单来自降级路径（上游问不到）时用黄色示警：还能切，但可能不是最新的 */
  .model-pick.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
  .card-bd{padding:14px 16px}
  .col-right{display:flex;flex-direction:column;gap:16px;min-width:0}

  /* ---------------- upload ---------------- */
  .drop{
    border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);
    padding:20px 14px;text-align:center;cursor:pointer;transition:.16s;background:#fbfcfd;
    min-height:106px;display:flex;flex-direction:column;justify-content:center;gap:3px;
  }
  .drop:hover,.drop:focus-visible,.drop.over{border-color:var(--accent);background:var(--accent-soft);outline:none}
  .drop b{font-size:13.5px;font-weight:600}
  .drop span{color:var(--muted);font-size:12px}
  .drop.busy{cursor:progress;border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
  .drop.err{border-color:var(--bad);background:var(--bad-soft)}
  .drop .retry{margin-top:8px;align-self:center}
  .hint{color:var(--muted);font-size:12px;line-height:1.7;margin:10px 0 0;padding:0}

  /* ---------------- doc list ---------------- */
  .docs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .docs:empty{display:none}
  .doc{
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;
    transition:.14s;position:relative;background:#fff;
  }
  .doc:hover{border-color:var(--line-strong);background:#fcfcfd}
  .doc.active{border-color:var(--accent);background:var(--accent-soft)}
  .doc .name{font-weight:600;font-size:13px;line-height:1.45;word-break:break-all;padding-right:38px}
  .doc .meta{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:4px}
  .doc .del{
    position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);
    cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;transition:.12s;
  }
  .doc .del:hover{background:var(--bad-soft);color:var(--bad)}
  .doc .del:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:10.5px;padding:1.5px 6px;border-radius:5px;background:#f1f3f6;color:var(--muted);font-family:var(--mono)}
  .tag.zh{background:var(--accent-soft);color:var(--accent-ink)}
  .tag.en{background:var(--ok-soft);color:var(--ok)}
  .tag.prof{background:var(--warn-soft);color:var(--warn)}

  /* ---------------- buttons ---------------- */
  button{font-family:inherit}
  button.act{
    border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    padding:7px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:.13s;
    min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  button.act:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.act:disabled{opacity:.48;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
  button.primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
  button.ghost{border-color:transparent;background:transparent;color:var(--accent)}
  button.ghost:hover:not(:disabled){background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}

  /* ---------------- tabs ---------------- */
  .tabs{display:flex;gap:2px;background:#f2f4f7;padding:3px;border-radius:9px}
  .tab{
    border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;
    color:var(--muted);cursor:pointer;transition:.13s;font-weight:500;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.07)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .panel.hide{display:none}
  .panel{min-height:220px}
  .panel-note{color:var(--muted);font-size:12px;margin:0 0 10px;line-height:1.6}

  /* ---------------- terms ---------------- */
  .term-row{
    display:grid;grid-template-columns:minmax(112px,168px) 1fr;gap:12px;
    padding:9px 0;border-bottom:1px dashed var(--line);align-items:start;
  }
  .term-row:last-child{border-bottom:0}
  .term-name{font-weight:600;font-size:13px;line-height:1.4;word-break:break-word}
  .term-name em{font-style:normal;color:var(--muted);font-weight:400;font-family:var(--mono);font-size:11px;margin-left:5px}
  .term-ctx{
    color:var(--muted);font-size:12px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .pages{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .page{
    font-family:var(--mono);font-size:10.5px;background:#f1f3f6;border-radius:4px;
    padding:1px 5px;color:var(--muted);white-space:nowrap;
  }
  .empty{color:var(--muted);font-size:12.5px;line-height:1.7;padding:4px 0}
  .empty b{color:var(--ink);font-weight:600}
  #panel-terms{max-height:460px;overflow-y:auto;overscroll-behavior:contain}
  #panel-profile{max-height:520px;overflow-y:auto;overscroll-behavior:contain}
  #panel-terms::-webkit-scrollbar,#panel-profile::-webkit-scrollbar{width:8px}
  #panel-terms::-webkit-scrollbar-thumb,#panel-profile::-webkit-scrollbar-thumb{background:#d9dde3;border-radius:4px}

  /* ---------------- profile ---------------- */
  .kv{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;font-size:13px;margin:0 0 14px}
  .kv dt{color:var(--muted);font-size:12px;padding-top:1px}
  .kv dd{margin:0;line-height:1.6}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:99px;font-family:var(--mono);white-space:nowrap}
  .badge.llm{background:var(--accent-soft);color:var(--accent-ink)}
  .badge.stat{background:var(--warn-soft);color:var(--warn)}
  .phr{
    font-size:12.5px;padding:7px 11px;background:#fbfcfd;border-left:2px solid var(--line-strong);
    border-radius:0 7px 7px 0;margin-bottom:6px;color:#33383f;
  }

  /* ---------------- ask ---------------- */
  .askbar{display:flex;gap:8px;align-items:stretch}
  .askbar .q{
    flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;
    font-size:14px;font-family:inherit;outline:none;transition:.13s;background:#fff;color:var(--ink);
    min-height:var(--tap);
  }
  .askbar .q::placeholder{color:#9aa1ac}
  .askbar .q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .askbar .ctl{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .askbar select,.askbar input[type=number]{
    border:1px solid var(--line-strong);border-radius:9px;padding:0 8px;font-size:12.5px;
    font-family:inherit;background:#fff;color:var(--ink);height:var(--tap);outline:none;transition:.13s;
  }
  .askbar select:focus,.askbar input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .askbar select{max-width:190px}
  .askbar input[type=number]{width:52px;text-align:center;font-family:var(--mono)}
  .mini{color:var(--muted);font-size:12px;white-space:nowrap}

  .answer{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .answer:empty{display:none}
  .answer p{margin:0 0 10px;font-size:14px;line-height:1.8}
  .answer p:last-of-type{margin-bottom:0}
  .answer strong{font-weight:650}
  .ref{
    font-family:var(--mono);font-size:11.5px;padding:0 4px;border-radius:4px;
    background:var(--accent-soft);color:var(--accent-ink);cursor:pointer;
    white-space:nowrap;transition:.12s;border:1px solid transparent;
  }
  .ref:hover{background:#e0eaff;border-color:#c7d7fe}
  .ref.bad{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
  .banner{padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
  /* ---------------- 自检 ---------------- */
  .check-intro{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0 0 12px}
  .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
  @media (max-width:720px){ .metrics{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .metric{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
  .metric .v{font-size:19px;font-weight:650;font-family:var(--mono);line-height:1.2}
  .metric .k{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.4}
  .metric .s{color:var(--muted);font-size:11px;margin-top:2px;font-family:var(--mono)}
  .metric.good .v{color:var(--ok)} .metric.warn .v{color:var(--warn)} .metric.bad .v{color:var(--bad)}
  .verdict{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
  .verdict.ok{background:var(--ok-soft);color:var(--ok)}
  .verdict.warn{background:var(--warn-soft);color:var(--warn)}
  .verdict.bad{background:var(--bad-soft);color:var(--bad)}
  .check-group{margin-top:14px}
  .check-group h3{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 2px}
  .check-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
  .check-item:last-child{border-bottom:0}
  .check-item .subj{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .check-item .det{color:var(--muted);line-height:1.55;margin-top:1px}
  .oc{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:99px;white-space:nowrap;text-align:center}
  .oc.ok{background:var(--ok-soft);color:var(--ok)}
  .oc.warn{background:var(--warn-soft);color:var(--warn)}
  .oc.bad{background:var(--bad-soft);color:var(--bad)}
  .banner.deny{background:var(--warn-soft);color:var(--warn)}
  .banner.bad{background:var(--bad-soft);color:var(--bad)}
  .banner code{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.04);padding:1px 4px;border-radius:3px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{
    font-family:var(--mono);font-size:11px;padding:2.5px 8px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent-ink);border:1px solid transparent;
  }
  .chip.bad{background:var(--bad-soft);color:var(--bad)}
  .meta-line{
    color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:12px;
    display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  }
  .meta-line .sep{color:var(--line-strong)}
  .ev{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fcfcfd;transition:.2s}
  .ev.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ev .hd{font-family:var(--mono);font-size:11px;color:var(--accent-ink);margin-bottom:5px;display:flex;gap:8px;align-items:baseline}
  .ev .hd .t{color:var(--muted);font-family:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .bd{font-size:12px;color:#3c4149;line-height:1.66;white-space:pre-wrap;max-height:160px;overflow:auto}

  .spin{
    display:inline-block;width:12px;height:12px;border:2px solid var(--line-strong);
    border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-2px;margin-right:6px;flex:0 0 auto;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{
    position:fixed;right:20px;bottom:20px;background:#14171c;color:#fff;padding:11px 15px;
    border-radius:9px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.2s;
    z-index:99;max-width:min(420px,calc(100vw - 40px));pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .toast.show{opacity:1;transform:none}
  .toast.err{background:var(--bad)}

  /* ---------------- 移动端 ---------------- */
  @media (max-width:1080px){
    #panel-terms{max-height:none}
    #panel-profile{max-height:none}
  }
  @media (max-width:720px){
    header{padding:11px 14px;gap:8px}
    .brand .sub{display:none}
    header h1{font-size:15px}
    main{padding:12px 12px 52px;gap:12px}
    .card-hd{padding:11px 13px;min-height:46px}
    /* 窄屏下模型名会和"仅在 u001 内检索"抢位置，让它整行独占 */
    .ask-hd{flex-wrap:wrap;row-gap:8px}
    .ask-hd .model-pick{flex:1 1 100%;max-width:none;order:3}
    .card-bd{padding:12px 13px}
    .term-row{grid-template-columns:1fr;gap:5px}
    .term-ctx{-webkit-line-clamp:3}
    .askbar{flex-wrap:wrap}
    .askbar .q{flex:1 1 100%}
    /* 窄屏下把"范围/条数/按钮"折到第二行，别让 select 和按钮互相挤 */
    .askbar .ctl{flex:1 1 100%;flex-wrap:wrap;row-gap:8px}
    .askbar .ctl select{flex:1 1 100%;min-width:0;max-width:none}
    .askbar .ctl button{flex:0 0 auto;min-width:88px;margin-left:auto}
    /* iOS 上 input 字号 <16px 会触发聚焦缩放 */
    .askbar .q,.askbar select,.askbar input[type=number]{font-size:16px}
    button.act{min-height:var(--tap)}
    .answer p{font-size:14.5px}
    .toast{right:12px;left:12px;bottom:12px;max-width:none}
    .doc .del{padding:8px 9px;top:2px}
  }
  @media (max-width:420px){
    .tabs .tab{padding:5px 9px;font-size:12px}
    .card-hd{gap:6px}
    .askbar input[type=number]{width:48px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>资料问答工作台</h1>
    <span class="sub">上传资料 → 看术语 → 带页码出处的问答</span>
  </div>
  <span class="grow"></span>
  <span class="status"><span id="dot" class="dot"></span><span id="health">连接中…</span></span>
</header>

<main>
  <!-- ============ 左：资料库 ============ -->
  <aside>
    <section class="card">
      <div class="card-hd">
        <h2>资料库</h2>
        <span class="count" id="docCount">0 份</span>
      </div>
      <div class="card-bd">
        <div class="drop" id="drop" role="button" tabindex="0" aria-label="点击选择文件上传">
          <b>拖入文件，或点击选择</b>
          <span>PDF / TXT / MD，单个不超过 50 MB</span>
        </div>
        <input type="file" id="file" accept=".pdf,.txt,.md" hidden />
        <p class="hint">
          中文资料直接检索；英文资料自动把中文问题翻成英文关键词再检索。<br />
          扫描件没有文字层，会被拒绝，需要先做 OCR。
        </p>
        <div class="docs" id="docs"></div>
      </div>
    </section>
  </aside>

  <!-- ============ 右：提问 + 资料分析 ============ -->
  <div class="col-right">
    <section class="card">
      <div class="card-hd ask-hd">
        <h2>提问</h2>
        <span class="count" id="askHint"></span>
        <select id="model" class="model-pick" aria-label="回答模型"></select>
      </div>
      <div class="card-bd">
        <div class="askbar">
          <input type="text" id="q" class="q" placeholder="问点什么，例如：因子旋转为什么不会改变共同度？"
                 aria-label="问题" autocomplete="off" />
          <div class="ctl">
            <select id="scope" aria-label="检索范围"><option value="">全部资料</option></select>
            <span class="mini">取前</span>
            <input type="number" id="topk" value="5" min="1" max="10" aria-label="检索条数" title="每次送入模型的片段数，越多越全但越慢越贵" />
            <span class="mini">条</span>
            <button class="act primary" id="askBtn">提问</button>
          </div>
        </div>
        <div id="answerBox"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-hd">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="terms" role="tab" aria-selected="true">关键术语</button>
          <button class="tab" data-tab="profile" role="tab" aria-selected="false">领域画像</button>
          <button class="tab" data-tab="check" role="tab" aria-selected="false">自检</button>
        </div>
        <span id="profBadge"></span>
        <span class="count" style="margin-left:auto">
          <button class="act" id="buildProfile" disabled>生成画像</button>
        </span>
      </div>
      <div class="card-bd">
        <div class="panel" id="panel-terms"></div>
        <div class="panel hide" id="panel-profile"></div>
        <div class="panel hide" id="panel-check"></div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtInt = (n) => Number(n || 0).toLocaleString("en-US");
const zhPage = (s) => String(s || "").includes(":") ? "p" + String(s).split(":")[1] : String(s || "");

// 原文片段是从长句里截出来的，起止都可能在词中间。这里压平空白、限长并补省略号，
// 让"被切断"看起来是刻意的省略，而不是渲染坏了。完整文本留在 title 属性里。
const trimCtx = (s) => {
  const t = String(s || "").replace(/\s+/g, " ").trim();
  return t.length > 86 ? t.slice(0, 86) + "…" : t;
};

let docs = [];
let current = null;
let lastFile = null;
let busy = {upload:false, ask:false, profile:false, check:false};
// 模型相关：MODELS 是服务端给的清单，model 是用户当前选的。
// 两者分开存——清单可能拉不到（MODELS 为 null），但选过的模型名要记住。
let MODELS = null;
let model = "";
const MODEL_KEY = "llm.model.pick";

/* ------------------------------- 基础 ------------------------------- */
function toast(msg, err){
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast show" + (err ? " err" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = "toast", err ? 5600 : 2800);
}

async function api(path, opts){
  let r;
  try{
    r = await fetch(path, opts);
  }catch(e){
    throw {message:"连不上本地服务", hint:"服务可能已停止，重新运行 python -m studio 再试"};
  }
  let data = null;
  try { data = await r.json(); } catch(e) {}
  if(!r.ok){
    throw (data && data.error) ? data.error : {message:`HTTP ${r.status}`, hint:""};
  }
  return data;
}

let HEALTH = null;

function updateHealthLabel(){
  if(!HEALTH) return;
  // 显示"当前真正会用的模型"：用户选过就用选的那个，否则用服务端默认。
  const m = model || HEALTH.model;
  $("#health").textContent = `${m} · ${HEALTH.docs} 份资料`;
}

async function health(){
  try{
    HEALTH = await api("/api/health");
    $("#dot").className = "dot";
    updateHealthLabel();
    return true;
  }catch(e){
    $("#dot").className = "dot off";
    $("#health").textContent = "服务未连接";
    return false;
  }
}

/* ------------------------------- 模型选择 ------------------------------- */
// localStorage 在隐私模式/被禁用时会直接抛异常，不能让它把整个初始化打断。
function storedModel(){
  try{ return localStorage.getItem(MODEL_KEY) || ""; }catch(e){ return ""; }
}
function rememberModel(v){
  try{ localStorage.setItem(MODEL_KEY, v); }catch(e){}
}

function modelNote(id){
  if(!MODELS) return "";
  const hit = (MODELS.recommended || []).find(m => m.id === id);
  return hit ? hit.note : "";
}

async function loadModels(){
  try{
    MODELS = await api("/api/models");
  }catch(e){
    MODELS = null;   // 拉不到就不显示选择器：宁可不给选，也不要给一个假的清单
    $("#model").style.display = "none";
    return;
  }
  renderModelPicker();
}

function renderModelPicker(){
  const sel = $("#model");
  if(!sel) return;
  if(!MODELS){ sel.style.display = "none"; return; }

  const recs = MODELS.recommended || [];
  const others = MODELS.others || [];
  const known = new Set([...recs.map(m => m.id), ...others]);

  // 优先级：上次选的 > 服务端默认 > 推荐表第一个。
  // 上次选的必须校验还在清单里——换了服务商之后旧的模型名会失效，
  // 直接把它塞进 select 会变成一个"选了就报错"的选项。
  const saved = storedModel();
  model = known.has(saved)
    ? saved
    : (known.has(MODELS.current) ? MODELS.current : (recs[0] || {}).id || others[0] || "");

  const group = (label, items, withNote) => items.length ? `<optgroup label="${esc(label)}">` +
    items.map(m => {
      const id = withNote ? m.id : m;
      const tail = withNote ? (m.reasoning ? " · 推理型" : "") : "";
      const title = withNote ? m.note : "";
      return `<option value="${esc(id)}"${title ? ` title="${esc(title)}"` : ""}>${esc(id)}${tail}</option>`;
    }).join("") + "</optgroup>" : "";

  sel.innerHTML =
    group("推荐", recs, true) +
    group(`全部聊天模型（${others.length}）`, others, false) +
    // 兜底：默认模型既不在推荐里也不在 others 里（配置写错了），也要能显示出来
    (!known.has(model) && model ? `<option value="${esc(model)}">${esc(model)}（不在清单里）</option>` : "");

  sel.value = model;
  sel.classList.toggle("warn", MODELS.source !== "upstream");
  sel.title = MODELS.source !== "upstream"
    ? (MODELS.note || "模型清单可能不是最新的，但仍然可以切换")
    : `换模型只影响之后的提问；服务端默认是 ${MODELS.current}`;
  updateHealthLabel();
}

$("#model").addEventListener("change", (e) => {
  model = e.target.value;
  rememberModel(model);
  const note = modelNote(model);
  toast(`之后的问题由 ${model} 回答${note ? "（" + note + "）" : ""}`);
  updateHealthLabel();
});
setInterval(() => { if(!document.hidden) health(); }, 15000);

/* ------------------------------- 文档列表 ------------------------------- */
function renderDocs(){
  const box = $("#docs");
  $("#docCount").textContent = docs.length ? `${docs.length} 份` : "0 份";
  $("#scope").innerHTML = '<option value="">全部资料</option>' +
    docs.map(d => `<option value="${esc(d.doc_id)}">${esc(d.filename)}</option>`).join("");
  if(current && !docs.some(d => d.doc_id === current)) current = null;
  if(!docs.length){
    box.innerHTML = '<div class="empty">还没有资料。上传一份 PDF 或文本，这里就会出现资料卡片。</div>';
    $("#askBtn").disabled = true;
    $("#askHint").textContent = "先上传资料";
    return;
  }
  $("#askBtn").disabled = false;
  $("#askHint").textContent = current ? `仅在 ${current} 内检索` : "在全部资料内检索";
  box.innerHTML = docs.map(d => `
    <div class="doc ${current===d.doc_id?"active":""}" data-id="${esc(d.doc_id)}">
      <button class="del" data-del="${esc(d.doc_id)}" title="删除这份资料" aria-label="删除 ${esc(d.filename)}">×</button>
      <div class="name">${esc(d.filename)}</div>
      <div class="meta">${esc(d.doc_id)} · ${d.pages} 页 · ${fmtInt(d.chars)} 字 · ${d.chunks} 块</div>
      <div class="tags">
        <span class="tag ${d.lang==="zh"?"zh":(d.lang==="en"?"en":"")}">${esc(d.lang)}</span>
        ${d.has_profile ? '<span class="tag prof">已生成画像</span>' : ''}
        <span class="tag">${esc((d.uploaded_at||"").replace("T"," ").slice(5,16))}</span>
      </div>
    </div>`).join("");

  box.querySelectorAll(".doc").forEach(el => {
    el.onclick = (ev) => {
      if(ev.target.dataset.del) return;
      select(el.dataset.id);
    };
  });
  box.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.del;
      if(!confirm(`删除 ${id}？文件、切片和画像都会一并删掉，不能恢复。`)) return;
      try{
        await api(`/api/docs/${id}`, {method:"DELETE"});
        if(current === id){
          current = null;
          $("#panel-terms").innerHTML = emptyTerms();
          $("#panel-profile").innerHTML = emptyProfile();
          $("#profBadge").innerHTML = "";
          $("#buildProfile").disabled = true;
        }
        await loadDocs();
        toast(`已删除 ${id}`);
      }catch(e){ toast(e.message + (e.hint ? " — " + e.hint : ""), true); }
    };
  });
}

async function loadDocs(){
  const d = await api("/api/docs");
  docs = d.docs || [];
  renderDocs();
}

/* ------------------------------- 术语 ------------------------------- */
function emptyTerms(){
  return `<p class="empty">先上传或选择一份资料，这里会列出这份资料里的<b>术语</b>，
    每条都带它在原文出现的页码，点页码可以核对。</p>`;
}

// 术语有两个来源，必须在界面上说清楚是哪一种。
// 统计候选和模型筛过的结果长得一模一样，混在一起看就会把「必背」当术语。
function termsHead(t){
  if(t.source === "profile"){
    return `<div class="banner" style="border:1px solid var(--line);color:var(--muted)">
      <span class="badge llm">模型筛选</span>　领域：${esc(t.domain || "—")}　
      模型从统计候选里挑过一遍，原文里找不到的已丢弃。</div>`;
  }
  return `<div class="banner deny">
    <b>这些是统计候选，还没经过模型筛选。</b>算法只判断"这几个字是不是总黏在一起"，
    判断不了"是不是专业术语"——所以「必背」（来自【必背】标记）、「课件」（来自"课件 p.23"）
    这类版式词会混进来。点右上「生成画像」，模型会从里面挑出真正的领域词。</div>`;
}

async function loadTerms(id){
  const box = $("#panel-terms");
  box.innerHTML = '<div class="empty"><span class="spin"></span>正在读取术语…</div>';
  try{
    const t = await api(`/api/docs/${id}/terms?top_n=20`);
    if(current !== id) return;   // 用户已经切走了，别把旧结果盖上去
    box.innerHTML = termsHead(t) + (t.terms.length ? t.terms.map(x => `
      <div class="term-row">
        <div>
          <div class="term-name">${esc(x.term)}<em>${x.freq}×</em></div>
          <div class="pages">${(x.pages||[]).map(p =>
            `<span class="page" title="${esc(p)}">${esc(zhPage(p))}</span>`).join("")}</div>
        </div>
        <div class="term-ctx" title="${esc(x.evidence)}">${esc(trimCtx(x.evidence))}</div>
      </div>`).join('')
      : `<p class="empty">没抽到候选术语。原因通常是：资料太短（不足几千字），或正文里汉字太少。</p>`);
  }catch(e){
    if(current !== id) return;
    box.innerHTML = `<p class="empty">${esc(e.message)}${e.hint ? "<br>" + esc(e.hint) : ""}</p>`;
  }
}

async function select(id){
  current = id;
  if(id) history.replaceState(null, "", "#" + encodeURIComponent(id));
  renderDocs();
  $("#buildProfile").disabled = !id;
  if(!id) return;

  await loadTerms(id);
  renderCheckShell();
  loadProfile(id);
}

/* ------------------------------- 画像 ------------------------------- */
function emptyProfile(){
  return `<p class="empty">还没生成。点右上「生成画像」，模型会从上面的候选术语里挑出真正的领域词，
    并给出每种说法的出处；凡是原文里找不到的一律丢弃。不生成也能提问，只是少了一层领域措辞提示。</p>`;
}

function renderProfile(p){
  const box = $("#panel-profile");
  if(!p){
    $("#profBadge").innerHTML = "";
    box.innerHTML = emptyProfile();
    return;
  }
  $("#profBadge").innerHTML = p.source === "llm"
    ? '<span class="badge llm">模型筛选</span>'
    : '<span class="badge stat">纯统计</span>';

  const rejected = p.rejected || [];
  const dropped = p.notes_dropped || [];
  const fallback = p.source !== "llm" && p.fallback_reason
    ? `<div class="banner deny">模型这一步没有成功，已退回纯统计画像：<code>${esc(p.fallback_reason)}</code><br>
       候选术语仍然带页码和原文片段，可以直接使用；想重试请再点一次「生成画像」。</div>` : "";
  const warn = (rejected.length || dropped.length)
    ? `<div class="banner ${rejected.length ? "bad" : "deny"}">
         ${rejected.length ? `丢弃了 ${rejected.length} 个「原文里找不到」的术语：<code>${esc(rejected.join("、"))}</code><br>` : ""}
         ${dropped.length ? `丢弃了 ${dropped.length} 条「数字对不上原文」的说明：<code>${esc(dropped.join("、"))}</code>` : ""}
       </div>` : "";

  box.innerHTML = `
    <dl class="kv">
      <dt>领域</dt><dd>${esc(p.domain || "—")}</dd>
      <dt>概括</dt><dd>${esc(p.summary || "—")}</dd>
      <dt>术语</dt><dd>${p.terms.length} 条，逐字回原文校验</dd>
    </dl>
    ${p.terms.length ? p.terms.map(t => `
      <div class="term-row">
        <div>
          <div class="term-name">${esc(t.term)}<em>${t.freq}×</em></div>
          <div class="pages">${(t.pages||[]).map(x =>
            `<span class="page" title="${esc(x)}">${esc(zhPage(x))}</span>`).join("")}</div>
        </div>
        <div class="term-ctx" title="${esc(t.note || t.evidence)}">${esc(trimCtx(t.note || t.evidence))}</div>
      </div>`).join('')
      : '<p class="empty">模型没有挑出任何能通过校验的术语。</p>'}
    ${(p.phrasings||[]).length ? `<div style="margin-top:14px">
      <div class="panel-note" style="margin-bottom:6px">这份资料里可能怎么问：</div>
      ${p.phrasings.map(x => `<div class="phr">${esc(x.question)}</div>`).join("")}
    </div>` : ""}
    ${warn}${fallback}`;
}

async function loadProfile(id){
  try{
    const d = await api(`/api/docs/${id}/profile`);
    if(current !== id) return;
    renderProfile(d.profile);
  }catch(e){
    if(current !== id) return;
    $("#panel-profile").innerHTML = `<p class="empty">${esc(e.message)}</p>`;
  }
}

$("#buildProfile").onclick = async () => {
  if(!current || busy.profile) return;
  busy.profile = true;
  const btn = $("#buildProfile");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>生成中';
  switchTab("profile");
  try{
    const d = await api(`/api/docs/${current}/profile` + (model ? `?model=${encodeURIComponent(model)}` : ""), {method:"POST"});
    renderProfile(d.profile);
    // 画像一生成，术语页的来源就从"统计候选"变成"模型筛过的那份"，
    // 这里顺手刷新，否则切回去还是旧列表——用户会以为筛选没生效。
    if(d.profile.source === "llm") await loadTerms(current);
    await loadDocs();
    toast(d.profile.source === "llm"
      ? `画像已生成：${d.profile.terms.length} 个术语`
      : "模型不可用，已退回纯统计画像");
  }catch(e){
    toast(`${e.message}${e.hint ? " — " + e.hint : ""}`, true);
  }finally{
    busy.profile = false;
    btn.disabled = false; btn.textContent = "生成画像";
  }
};

/* ------------------------------- 自检 ------------------------------- */
// 结局 → 中文与配色。fabricated / no_hit / no_citation 是三种真问题，
// refused 是好事（该拒的拒了），不能一律染红——否则用户会以为每次自检都失败。
const OC_TEXT = {ok:"通过", partial:"部分", no_citation:"无出处", refused:"已拒答",
                 fabricated:"编造", answered_without_citation:"无出处", no_hit:"未命中"};
const OC_CLASS = {ok:"ok", partial:"warn", no_citation:"warn", refused:"ok",
                  fabricated:"bad", answered_without_citation:"warn", no_hit:"bad"};

function renderCheckShell(){
  const box = $("#panel-check");
  box.innerHTML = `
    <p class="check-intro">自检<b>不判断“答得对不对”</b>——那需要标准答案，任何一份新资料都没有。
      它只查四件能机械核实的事：引用标的页上<b>有没有那个词</b>、答案<b>有没有出处</b>、
      拿一个文档里肯定不存在的随机串去问它<b>敢不敢编</b>、同一术语换三种问法<b>检索稳不稳</b>。
      <br>默认问 5 个术语 + 3 个假问题，约 20 秒、¥0.07。</p>
    <button class="act primary" id="runCheck" ${current ? "" : "disabled"}>开始自检</button>
    <div id="checkResult"></div>`;
  const btn = $("#runCheck");
  if(btn) btn.onclick = runCheck;
}

function renderCheck(r){
  const m = r.metrics || {};
  const box = $("#checkResult");
  if(!box) return;
  const tone = r.verdict === "可溯源" ? "ok" : (r.verdict === "有风险" ? "bad" : "warn");
  const pct = v => (v === null || v === undefined) ? "—" : Math.round(v * 100) + "%";
  const grade = (v, good, bad) => v === null || v === undefined ? bad : (v >= good ? "good" : "warn");

  const tiles = [
    {k:"引用可核验", v: m.citation_verified === null ? "—" : pct(m.citation_verified),
     s:`${m.citations_ok}/${m.citations_total} 条引用`, tone: m.citation_verified === null ? "bad" : grade(m.citation_verified, 0.9, "bad")},
    {k:"有据回答", v: pct(m.grounded), s:"答完有没有标出处", tone: grade(m.grounded, 0.8, "warn")},
    {k:"资料外拒答", v: pct(m.refusal), s: m.fabricated ? `${m.fabricated} 次编造` : "没有编造",
     tone: m.fabricated ? "bad" : grade(m.refusal, 0.9, "bad")},
    {k:"检索稳定", v: pct(m.retrieval_stability), s:"三种问法的页码重合度", tone: grade(m.retrieval_stability, 0.6, "warn")},
  ];

  const groups = [
    ["citation", "引用检查", "每条答案标的出处，那一页上有没有出现这个词"],
    ["negative", "资料外问题", "随机串在文档里不存在，正确反应是拒答"],
    ["stability", "检索稳定性", "同一术语三种问法，取回的证据是不是同一片"],
  ];

  box.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px">
      <span class="verdict ${tone}">${esc(r.verdict)}</span>
      <span style="color:var(--muted);font-size:12px">${esc((r.items||[]).length)} 项检查 · ${esc(r.terms.join("、"))}${r.model ? " · " + esc(r.model) : ""}</span>
    </div>
    ${(r.verdict_reasons||[]).length ? `<div class="banner ${tone === "ok" ? "deny" : "bad"}">
      ${r.verdict_reasons.map(x => esc(x)).join("<br>")}</div>` : ""}
    <div class="metrics">
      ${tiles.map(t => `<div class="metric ${t.tone}"><div class="v">${esc(t.v)}</div>
        <div class="k">${esc(t.k)}</div><div class="s">${esc(t.s)}</div></div>`).join("")}
    </div>
    ${groups.map(([key, title, note]) => {
      const rows = (r.items || []).filter(i => i.check === key);
      if(!rows.length) return "";
      return `<div class="check-group"><h3>${esc(title)}<span style="font-weight:400"> · ${esc(note)}</span></h3>
        ${rows.map(i => `<div class="check-item">
          <span class="oc ${OC_CLASS[i.outcome] || "warn"}">${esc(OC_TEXT[i.outcome] || i.outcome)}</span>
          <div><div class="subj">${esc(i.subject)}</div><div class="det">${esc(i.detail)}</div></div>
        </div>`).join("")}</div>`;
    }).join("")}
    <p class="panel-note" style="margin-top:12px">花费 ¥${Number(r.cost_cny||0).toFixed(4)} · 用时 ${Number(r.seconds||0).toFixed(1)} 秒 · ${esc((r.generated_at||"").replace("T"," "))}
      <br>这些指标只证明“可溯源、该拒就拒、换问法不飘”，不证明内容全对。</p>`;
}

async function runCheck(){
  if(!current || busy.check) return;
  busy.check = true;
  const btn = $("#runCheck");
  const box = $("#checkResult");
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span>自检中（8 次模型调用）'; }
  if(box) box.innerHTML = '<div class="empty"><span class="spin"></span>抽样术语 → 逐个提问 → 核对引用页 → 造 3 个假问题</div>';
  try{
    const r = await api(`/api/docs/${encodeURIComponent(current)}/selfcheck?n_terms=5&n_negative=3`
      + (model ? `&model=${encodeURIComponent(model)}` : ""), {method:"POST"});
    if(!$("#panel-check")) return;
    renderCheck(r);
    toast(`自检完成：${r.verdict}`);
  }catch(e){
    if(box) box.innerHTML = `<p class="empty">${esc(e.message)}${e.hint ? "<br>" + esc(e.hint) : ""}</p>`;
    toast(`${e.message}${e.hint ? " — " + e.hint : ""}`, true);
  }finally{
    busy.check = false;
    if(btn){ btn.disabled = false; btn.textContent = "重新自检"; }
  }
}

/* ------------------------------- tab ------------------------------- */
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle("active", on);
    t.setAttribute("aria-selected", on ? "true" : "false");
  });
  $("#panel-terms").classList.toggle("hide", name !== "terms");
  $("#panel-profile").classList.toggle("hide", name !== "profile");
  $("#panel-check").classList.toggle("hide", name !== "check");
}
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => switchTab(t.dataset.tab);
});

/* ------------------------------- 上传 ------------------------------- */
const drop = $("#drop"), fileInput = $("#file");

function dropIdle(){
  drop.className = "drop";
  drop.innerHTML = '<b>拖入文件，或点击选择</b><span>PDF / TXT / MD，单个不超过 50 MB</span>';
  drop.onclick = () => fileInput.click();
  drop.onkeydown = (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fileInput.click(); } };
}

dropIdle();
fileInput.onchange = () => {
  if(fileInput.files.length) upload(fileInput.files[0]);
  fileInput.value = "";
};
["dragenter","dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); if(!busy.upload) drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => {
  if(busy.upload) return;
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) upload(f);
});
// 拖到页面其它地方时别让浏览器直接打开文件
["dragover","drop"].forEach(ev =>
  window.addEventListener(ev, e => { if(!drop.contains(e.target)) e.preventDefault(); }));

async function upload(f){
  if(busy.upload) return;
  busy.upload = true;
  lastFile = f;
  drop.className = "drop busy";
  drop.onclick = null; drop.onkeydown = null;
  drop.innerHTML = `<b><span class="spin"></span>正在解析 ${esc(f.name)}</b><span>扫描件、大文件需要几秒</span>`;
  const fd = new FormData();
  fd.append("file", f, f.name);
  try{
    const r = await api("/api/docs", {method:"POST", body:fd});
    await loadDocs();
    await select(r.doc.doc_id);
    toast(`已解析 ${r.doc.filename}：${r.doc.pages} 页 / ${r.doc.chunks} 块 / ${r.doc.lang}`);
  }catch(e){
    drop.className = "drop err";
    drop.innerHTML = `<b>上传失败</b><span>${esc(e.message)}</span>
      <button class="act retry" id="retryBtn">重试</button>`;
    const rb = $("#retryBtn");
    if(rb) rb.onclick = (ev) => { ev.stopPropagation(); if(lastFile) upload(lastFile); };
    // 失败后仍然允许点空白处换一份文件，否则用户被锁在"重试"这一个选项上
    drop.onclick = () => fileInput.click();
    toast(`${e.message}${e.hint ? " — " + e.hint : ""}`, true);
  }finally{
    busy.upload = false;
    if(!drop.classList.contains("err")) dropIdle();
  }
}

/* ------------------------------- 答案渲染 ------------------------------- */
// 模型有时会输出 LaTeX（\(...\)、\sum_{i}、a_{ij}），也常输出 Unicode 数学符号。
// 页面没有公式引擎，直接把源码显示出来会是一屏反斜杠，所以做一次可读化降级：
// 去定界符 → 希腊字母/常用算符换符号 → 上下标花括号压平。不追求排版，只求能读。
const GREEK = {alpha:"α",beta:"β",gamma:"γ",Gamma:"Γ",delta:"δ",Delta:"Δ",epsilon:"ε",
  varepsilon:"ε",zeta:"ζ",eta:"η",theta:"θ",Theta:"Θ",lambda:"λ",Lambda:"Λ",mu:"μ",
  nu:"ν",xi:"ξ",Xi:"Ξ",pi:"π",rho:"ρ",sigma:"σ",Sigma:"Σ",tau:"τ",phi:"φ",varphi:"φ",
  Phi:"Φ",chi:"χ",psi:"ψ",Psi:"Ψ",omega:"ω",Omega:"Ω"};
const OPS = [[/\\sum(?![A-Za-z])/g,"∑"],[/\\prod(?![A-Za-z])/g,"∏"],
  [/\\times/g,"×"],[/\\cdot/g,"·"],[/\\div/g,"÷"],[/\\leq?(?![A-Za-z])/g,"≤"],
  [/\\geq?(?![A-Za-z])/g,"≥"],[/\\neq?(?![A-Za-z])/g,"≠"],[/\\approx/g,"≈"],
  [/\\equiv/g,"≡"],[/\\pm/g,"±"],[/\\infty/g,"∞"],[/\\in(?![A-Za-z])/g,"∈"],
  [/\\notin/g,"∉"],[/\\subset/g,"⊂"],[/\\cup/g,"∪"],[/\\cap/g,"∩"],[/\\partial/g,"∂"],
  [/\\nabla/g,"∇"],[/\\sqrt/g,"√"],[/\\prime/g,"′"],[/\\ldots|\\dots|\\cdots/g,"…"],
  [/\\left|\\right/g,""],[/\\[a-zA-Z]+\{?/g,""],[/\\[,;:! ]/g," "],[/\\%/g,"%"]];

// \frac{A}{B} 里的 A、B 常带嵌套花括号（\sum_{i}、\bar{x}），正则数不清配对，
// 所以这里手动扫一遍括号，转成 (A)/(B)。
function matchBrace(s, start){
  let depth = 0;
  for(let k = start; k < s.length; k++){
    if(s[k] === "{") depth++;
    else if(s[k] === "}"){
      depth--;
      if(depth === 0) return {body: s.slice(start+1, k), end: k+1};
    }
  }
  return null;
}
function replaceFrac(s){
  let i = 0, guard = 0;
  while(guard++ < 40 && (i = s.indexOf("\\frac", i)) !== -1){
    let p = i + 5;
    while(s[p] === " ") p++;
    const a = s[p] === "{" ? matchBrace(s, p) : null;
    if(!a){ i += 5; continue; }
    let q = a.end;
    while(s[q] === " ") q++;
    const b = s[q] === "{" ? matchBrace(s, q) : null;
    if(!b){ i += 5; continue; }
    s = s.slice(0, i) + `(${a.body})/(${b.body})` + s.slice(b.end);
    i += 1;
  }
  return s;
}

function deTeX(s){
  s = s.replace(/\\\(([\s\S]*?)\\\)/g, "$1").replace(/\\\[([\s\S]*?)\\\]/g, "$1");
  s = s.replace(/\$\$([\s\S]*?)\$\$/g, "$1").replace(/\$([^$\n]{1,80}?)\$/g, "$1");
  s = replaceFrac(s);
  s = s.replace(/\\(?:begin|end)\{[^{}]*\}/g, "");
  s = s.replace(/\\bar\{([^{}]*)\}/g, "$1\u0304")
       .replace(/\\hat\{([^{}]*)\}/g, "$1\u0302")
       .replace(/\\tilde\{([^{}]*)\}/g, "$1\u0303")
       .replace(/\\vec\{([^{}]*)\}/g, "$1\u20d7");
  s = s.replace(/\\([A-Za-z]+)/g, (m, n) => GREEK[n] || m);
  for(const [re, to] of OPS) s = s.replace(re, to);
  s = s.replace(/_\{([^{}]*)\}/g, "_$1").replace(/\^\{([^{}]*)\}/g, "^$1");
  return s.replace(/\\\\/g, "；").replace(/[{}]/g, "").replace(/[ \t]{2,}/g, " ");
}

// 模型返回的是轻量 markdown（**粗体**、【doc:pN】引用）。这里只认这三种结构，
// 先转义再替换，不给注入留口子；不引入任何外部库，断网也能渲染。
function rich(text, unsupported){
  const bad = new Set(unsupported || []);
  let s = deTeX(esc(text));
  s = s.replace(/【([^】]{1,40})】/g, (m, id) => {
    const cls = bad.has(id) ? "ref bad" : "ref";
    return `<span class="${cls}" data-ref="${id}" title="点击定位到这一段原文">${id}</span>`;
  });
  s = s.replace(/\*\*([^*\n]{1,60})\*\*/g, "<strong>$1</strong>");
  return s.split(/\n{2,}/).map(par =>
    `<p>${par.replace(/\n/g, "<br>")}</p>`
  ).join("");
}

function renderAnswer(r, scroll){
  const denied = r.denied;
  const bad = (r.unsupported || []).length;
  const banner = denied
    ? `<div class="banner deny">资料里没有足够依据可答（模型判定「资料未覆盖」，或检索到的片段都不相关）。
        这是设计内的<b>拒答</b>，不是出错。</div>`
    : (bad ? `<div class="banner bad">有 ${bad} 个引用指向本次没有检索到的页，疑似编造出处：
        ${esc(r.unsupported.join("、"))}</div>` : "");
  const chips = (r.citations || []).map(c =>
    `<span class="chip ${(r.unsupported||[]).includes(c) ? "bad" : ""}">${esc(c)}</span>`).join("");
  const ev = (r.evidence || []).map(e => `
    <div class="ev" data-src="${esc(e.source)}">
      <div class="hd"><span>${esc(e.source)}</span><span>·</span><span>${e.score}</span>
        <span class="t">${esc(e.title || "")}</span></div>
      <div class="bd">${esc(e.text)}</div>
    </div>`).join("");
  const meta = [
    r.model ? `${r.model}` : "",
    `${Math.round(r.latency_ms)} ms`,
    r.cost_cny ? `¥${r.cost_cny.toFixed(4)}` : "",
    `${(r.doc_ids||[]).length || 1} 份资料 · 前 ${r.top_k} 条`,
    r.translated ? "已译为英文检索词" : "直接检索",
    r.profile_source === "llm" ? "已注入领域术语" : (r.profile_source ? "纯统计画像" : "无画像"),
    (r.expanded_terms||[]).length ? `扩展词 ${r.expanded_terms.join(" / ")}` : "",
  ].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('<span class="sep">|</span>');

  $("#answerBox").innerHTML = `
    <div class="answer">
      ${banner}
      ${rich(r.answer, r.unsupported)}
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      <div class="meta-line">${meta}</div>
      ${ev ? `<div style="margin-top:16px">
        <div class="panel-note" style="margin-bottom:8px">检索依据（按相关度排序，点上面的引用可定位）</div>
        ${ev}</div>` : ""}
    </div>`;

  $("#answerBox").querySelectorAll(".ref").forEach(el => {
    el.onclick = () => {
      const target = [...$("#answerBox").querySelectorAll(".ev")]
        .find(x => x.dataset.src === el.dataset.ref);
      if(!target){ toast(`本次检索里没有 ${el.dataset.ref} 这一段`); return; }
      target.scrollIntoView({behavior:"smooth", block:"center"});
      target.classList.add("flash");
      setTimeout(() => target.classList.remove("flash"), 1600);
    };
  });
  if(scroll) $("#answerBox").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ------------------------------- 提问 ------------------------------- */
$("#askBtn").onclick = ask;
$("#q").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.isComposing) { e.preventDefault(); ask(); }
});
$("#topk").addEventListener("change", () => {
  const el = $("#topk");
  let v = parseInt(el.value, 10);
  if(!Number.isFinite(v)) v = 5;
  v = Math.min(10, Math.max(1, v));
  el.value = v;
});

async function ask(auto){
  if(busy.ask) return;
  const q = $("#q").value.trim();
  if(!q){ toast("先写一个问题再点提问"); $("#q").focus(); return; }
  busy.ask = true;
  const btn = $("#askBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>检索中';
  $("#answerBox").innerHTML = '<div class="answer"><div class="empty"><span class="spin"></span>检索片段 → 拼上下文 → 模型作答…</div></div>';
  const started = Date.now();
  const body = {
    question: q,
    doc_ids: $("#scope").value ? [$("#scope").value] : null,
    top_k: Math.min(10, Math.max(1, parseInt($("#topk").value || "5", 10))),
    // 空串表示"用服务端默认"，不要发 null 之外的东西——后端把空串当没指定
    model: model || null,
  };
  try{
    const r = await api("/api/ask", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
    });
    renderAnswer(r, !auto);
  }catch(e){
    $("#answerBox").innerHTML = `<div class="answer"><div class="banner bad">
      <b>${esc(e.message)}</b>${e.hint ? "<br>" + esc(e.hint) : ""}<br>
      已等待 ${Math.round((Date.now()-started)/1000)} 秒。可以稍后重试，或把「取前」调小再试一次。</div></div>`;
  }finally{
    busy.ask = false;
    btn.disabled = false; btn.textContent = "提问";
  }
}

/* ------------------------------- 启动 ------------------------------- */
(async function init(){
  const params = new URLSearchParams(location.search);
  const tab = params.get("tab");
  if(tab && ["terms", "profile", "check"].includes(tab)) switchTab(tab);
  const ok = await health();
  if(!ok){ toast("连不上本地服务，先运行 python -m studio", true); }
  await loadModels();
  try{
    await loadDocs();
  }catch(e){
    toast(e.message + (e.hint ? " — " + e.hint : ""), true);
    return;
  }
  if(!docs.length){
    $("#panel-terms").innerHTML = emptyTerms();
    $("#panel-profile").innerHTML = emptyProfile();
    $("#askBtn").disabled = true;
    return;
  }
  const want = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(want && docs.some(d => d.doc_id === want)) await select(want);
  else if(docs.length === 1) await select(docs[0].doc_id);
  else $("#panel-terms").innerHTML = emptyTerms();

  const autoQ = params.get("q");
  if(autoQ){ $("#q").value = autoQ; await ask(true); }
})();
</script>
